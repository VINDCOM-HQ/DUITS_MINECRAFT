# ═══════════════════════════════════════════════════════════════════
# NetherDeck - Docker Swarm stack (single replica)
# ═══════════════════════════════════════════════════════════════════
# Deploy:  docker stack deploy -c container/netherdeck-stack.yml netherdeck
#
# Topology:
#   - Web portal (:3000)  -> reached by the WAF over `app-network`
#                            (server_name mc.clouddux.tech -> netherdeck:3000)
#                            NOT host-published.
#   - Minecraft (25565)   -> published directly on the host (mode: host),
#                            bypassing the WAF (raw TCP, not HTTP).
#   - RCON / MySQL / SMB  -> internal only (never published).
# Set secrets/values in a stack .env or via `docker secret`/`docker config`.
# ═══════════════════════════════════════════════════════════════════

services:
  netherdeck:
    image: ${DOCKER_HUB_USERNAME:-downunderit}/netherdeck-neoforge:latest
    networks:
      app-network:
        # Stable alias so the WAF can reach the portal as `netherdeck:3000`
        # regardless of the deployed stack name (else it'd be netherdeck_netherdeck).
        aliases:
          - netherdeck
    ports:
      # Game — published directly on the host, bypassing the WAF (TCP + UDP query)
      - target: 25565
        published: 25565
        protocol: tcp
        mode: host
      - target: 25565
        published: 25565
        protocol: udp
        mode: host
      # NOTE: 3000 (portal), 25575 (RCON), 3306 (MySQL), 445/139 (SMB) are
      # intentionally NOT published — the portal is fronted by the WAF over
      # app-network; RCON/MySQL/SMB stay internal to the container.
    volumes:
      - mc_data:/minecraft
      - mysql_data:/var/lib/mysql
      - smb_logs:/var/log/samba
      - supervisor_logs:/var/log/supervisor
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "25565"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '4.0'
          memory: 10G
        reservations:
          cpus: '2.0'
          memory: 4G
    environment:
      # ── Infra / EULA ──
      - TZ=${TZ:-UTC}
      - MC_EULA=true
      - MC_MIN_MEMORY=${MC_MIN_MEMORY:-2G}
      - MC_MAX_MEMORY=${MC_MAX_MEMORY:-6G}
      - MC_MOTD=${MC_MOTD:-NetherDeck}
      # ── MySQL (internal; bound to container localhost) ──
      - MYSQL_USER=${MYSQL_USER:-mcuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      - MYSQL_DATABASE=${DATABASE_NAME:-minecraft}
      - MC_MYSQL_BIND=127.0.0.1
      # ── Samba (internal) ──
      - SMB_USER=${SMB_USER:-mcadmin}
      - SMB_PASSWORD=${SMB_PASSWORD:?set SMB_PASSWORD}
      # ── RCON (internal; portal connects via localhost) ──
      - MC_ENABLE_RCON=true
      - MC_RCON_PASSWORD=${MC_RCON_PASSWORD:?set MC_RCON_PASSWORD}
      # ── Web portal (fronted by the WAF) ──
      - ENABLE_WEB_PORTAL=true
      - WEB_PORTAL_PORT=3000
      # SvelteKit (adapter-node) must know its public origin for CSRF/form actions
      # behind the TLS-terminating WAF; cookies stay secure (HTTPS at the edge).
      - ORIGIN=https://mc.clouddux.tech
      - WEB_PORTAL_SECURE_COOKIES=true
      - WEB_PORTAL_SESSION_SECRET=${WEB_PORTAL_SESSION_SECRET:?set WEB_PORTAL_SESSION_SECRET}
      - WEB_PORTAL_ADMIN_USER=${WEB_PORTAL_ADMIN_USER:-admin}
      - WEB_PORTAL_ADMIN_PASSWORD=${WEB_PORTAL_ADMIN_PASSWORD:?set WEB_PORTAL_ADMIN_PASSWORD}
      - WEB_PORTAL_DB_USER=${WEB_PORTAL_DB_USER:-netherdeck}
      - WEB_PORTAL_DB_PASSWORD=${WEB_PORTAL_DB_PASSWORD:?set WEB_PORTAL_DB_PASSWORD}
      - WEB_PORTAL_DB_NAME=${WEB_PORTAL_DB_NAME:-netherdeck}
      - WEB_PORTAL_GAME_DB_NAME=${DATABASE_NAME:-minecraft}
      # Portal -> RCON (inside the container)
      - WEB_PORTAL_RCON_HOST=localhost
      - WEB_PORTAL_RCON_PORT=25575
      - WEB_PORTAL_RCON_PASSWORD=${MC_RCON_PASSWORD:?set MC_RCON_PASSWORD}
      # ── World map (BlueMap) ──
      - ENABLE_WORLD_MAP=${ENABLE_WORLD_MAP:-true}

networks:
  app-network:
    external: true

volumes:
  mc_data:
    driver: local
  mysql_data:
    driver: local
  smb_logs:
    driver: local
  supervisor_logs:
    driver: local
