# ═══════════════════════════════════════════════════════════════════
# NetherDeck Container - Docker Build & Push
# ═══════════════════════════════════════════════════════════════════
# Builds the server JAR from source, then builds + pushes the image.
# A TruffleHog secrets scan gates the build. Image is published only on
# push to main (PRs run the gate but do not build/push).
# Semgrep SAST + SCA is handled centrally in semgrep.yml.
# ═══════════════════════════════════════════════════════════════════

name: Build Docker Image

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'container/**'
      - 'agent/**'
      - 'web/**'
      - 'NetherDeck Server/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'container/**'
      - 'agent/**'
      - 'web/**'
      - 'NetherDeck Server/**'
  workflow_dispatch:

jobs:
  # ───────────────────────────────────────────────────────────────────
  # Secrets Scanning - detects leaked credentials, gates the build
  # ───────────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@586f66d7886cd0b037c7c245d4a6e34ef357ab10 # v3.94.1
        continue-on-error: true
        with:
          path: .
          extra_args: --only-verified

  # ───────────────────────────────────────────────────────────────────
  # Build & Push - only on push to main (not on pull requests)
  # ───────────────────────────────────────────────────────────────────
  build:
    name: Build and Push (${{ matrix.loader }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: [secrets-scan]
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        loader: [forge, neoforge, fabric]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The server JAR is gitignored and built from source here so the image
      # always bundles current server code. The loader-specific bootstrap task
      # (e.g. :bootstrap:neoforgeJar) is required — `build` alone does not
      # assemble it.
      - name: Set up JDK 21
        uses: actions/setup-java@v4 # TODO: pin to a commit SHA to match repo convention
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build NetherDeck Server JAR (${{ matrix.loader }})
        working-directory: NetherDeck Server
        run: |
          chmod +x ./gradlew
          ./gradlew :bootstrap:${{ matrix.loader }}Jar --no-daemon --stacktrace

      - name: Verify server JAR was produced
        run: |
          JAR=$(ls "NetherDeck Server/bootstrap/build/libs/netherdeck-${{ matrix.loader }}-"*.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then
            echo "::error::No server JAR found for loader ${{ matrix.loader }} — aborting build."
            exit 1
          fi
          echo "Found server JAR: $JAR"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/netherdeck-${{ matrix.loader }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: container/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: LOADER=${{ matrix.loader }}
          cache-from: type=gha,scope=${{ matrix.loader }}
          cache-to: type=gha,mode=max,scope=${{ matrix.loader }}
