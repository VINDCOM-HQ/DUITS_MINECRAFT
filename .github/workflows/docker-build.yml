name: Build Docker Image

on:
  push:
    branches: [develop, main]
    paths:
      - 'container/**'
      - 'agent/**'
      - 'web/**'
      - 'NetherDeck Server/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'container/**'
      - 'agent/**'
      - 'web/**'
      - 'NetherDeck Server/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        loader: [forge, neoforge, fabric]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The server JAR is gitignored and built from source here so the image
      # always bundles current server code. The loader-specific bootstrap task
      # (e.g. :bootstrap:neoforgeJar) is required — `build` alone does not
      # assemble it.
      - name: Set up JDK 21
        uses: actions/setup-java@v4 # TODO: pin to a commit SHA to match repo convention
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build NetherDeck Server JAR (${{ matrix.loader }})
        working-directory: NetherDeck Server
        run: |
          chmod +x ./gradlew
          ./gradlew :bootstrap:${{ matrix.loader }}Jar --no-daemon --stacktrace

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: vindcom/netherdeck-${{ matrix.loader }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: container/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: LOADER=${{ matrix.loader }}
          cache-from: type=gha,scope=${{ matrix.loader }}
          cache-to: type=gha,mode=max,scope=${{ matrix.loader }}
